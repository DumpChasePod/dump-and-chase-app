name: Restore Host Photos

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update Podcast Feed"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-host-photos:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Restore Meet the Hosts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def load_b64(path):
              return ''.join(Path(path).read_text(encoding='utf-8').split())

          sam=load_b64('hosts/sam-olmstead.jpg.b64')
          justin=load_b64('hosts/justin-irwin.jpg.b64')
          dan=load_b64('hosts/dan-conley-uploaded.b64')

          sam_img='data:image/jpeg;base64,'+sam
          justin_img='data:image/jpeg;base64,'+justin
          dan_img='data:image/jpeg;base64,'+dan

          # Remove any previous generated copy before rebuilding it.
          s=re.sub(r'\s*<style id="meetHostsStyles">.*?</style>\s*', '\n', s, flags=re.S)
          s=re.sub(r'\s*<section id="meetHostsSection">.*?</section>\s*', '\n', s, flags=re.S)

          hosts_styles='''<style id="meetHostsStyles">
          .hosts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
          .host-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
          .host-photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
          .host-body{padding:16px}.host-name{margin:0 0 4px;font-size:19px}.host-role{color:var(--accent);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}.host-bio{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
          @media(max-width:700px){.hosts-grid{grid-template-columns:1fr}}
          </style>'''

          hosts_html='''<section id="meetHostsSection">
            <div class="sectionhead"><h2>Meet the Hosts</h2></div>
            <div class="hosts-grid">
              <article class="host-card">
                <img class="host-photo" src="SAM_IMG" alt="Sam Olmstead">
                <div class="host-body">
                  <h3 class="host-name">Sam Olmstead</h3>
                  <div class="host-role">Host</div>
                  <p class="host-bio">Born just a stone's throw from the Ohio River, Sam is a 2002 graduate of Beaver Local High School. He graduated from Youngstown College of Massotherapy in 2004 and from the American Broadcasting School in 2012. He attended his first Phantoms game in March 2014 and became a season ticket holder starting with the 2016–17 season.<br><br>Sam has played guitar since he was 16. After 27 years, you'd think he would be better at it. He can also play 3 chords on a ukulele, and although he hasn't touched a trombone in 20 years, he is fairly confident that he could still play the Beaver Local Fight Song if he had access to one.<br><br>Sam resides in Salem, OH with his wife April, and three sons Brennan, Gavin, and Dashiell.</p>
                </div>
              </article>
              <article class="host-card">
                <img class="host-photo" src="JUSTIN_IMG" alt="Justin Irwin">
                <div class="host-body">
                  <h3 class="host-name">Justin Irwin</h3>
                  <div class="host-role">Host</div>
                  <p class="host-bio">Justin is a 1994 graduate of LaBrae, and did a brief stint at a business school in Pittsburgh that he doesn't really remember the name of. Already a lifelong hockey fan, after seeing 2 Phantoms games at the end of the 2010–11 seasons and a few more the next season, he went all in as a season ticket holder in 2012–13.<br><br>His hobbies, outside of supporting the Phantoms, include gaming, anime, and IT. The latter is also his profession, which unfortunately sucks the soul out of him. He's also an avid vodka drinker.<br><br>He now lives in Newton Township with his mom, who is also a huge Phantoms fan.</p>
                </div>
              </article>
              <article class="host-card">
                <img class="host-photo" src="DAN_IMG" alt="Dan Conley">
                <div class="host-body">
                  <h3 class="host-name">Dan Conley</h3>
                  <div class="host-role">Host</div>
                  <p class="host-bio">Dan is a 2005 graduate of Austintown Fitch High School. He is President of The United SteelWorkers of America Local 2332 and is an overhead craneman at Commercial Metal Forming. He used to play soccer growing up (when he was in shape and not a shape) and was a three year letterman in high school. Dan later became the head coach of his alma mater's boys soccer team and coached there for 7 years.<br><br>Dan is also an avid drummer and people that have been to any of his shows have described his drumming by calling it "Average at best".<br><br>Dan and his family have been attending games for many years but became season ticket holders during the 2021–2022 season. Dan still resides in Austintown with his wife, Heather, and sons Gavin and Owen.</p>
                </div>
              </article>
            </div>
          </section>'''

          hosts_html=hosts_html.replace('SAM_IMG',sam_img).replace('JUSTIN_IMG',justin_img).replace('DAN_IMG',dan_img)
          s=s.replace('</head>',hosts_styles+'\n</head>',1)
          if '<div class="admin-footer">' in s:
              s=s.replace('<div class="admin-footer">',hosts_html+'\n\n<div class="admin-footer">',1)
          else:
              s=s.replace('</main>',hosts_html+'\n</main>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate host section
        run: |
          test -f index.html
          grep -q 'Meet the Hosts' index.html
          grep -q 'Sam Olmstead' index.html
          grep -q 'Justin Irwin' index.html
          grep -q 'Dan Conley' index.html
          ! grep -q 'SAM_IMAGE' index.html
          ! grep -q 'JUSTIN_IMAGE' index.html
          ! grep -q 'DAN_IMAGE' index.html
      - name: Save host update
        run: |
          git config user.name "Dump & Chase Bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore Meet the Hosts section and photos"
          git push
